<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magneetar Logo Preview</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #E91E8C;
    }
    p {
      color: #888;
      margin-bottom: 2rem;
    }
    .logos {
      display: flex;
      gap: 3rem;
      align-items: flex-end;
      flex-wrap: wrap;
      justify-content: center;
    }
    .logo-item {
      text-align: center;
    }
    .logo-item span {
      display: block;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      color: #666;
    }
    .approved {
      margin-top: 3rem;
      padding: 1rem 2rem;
      background: rgba(233, 30, 140, 0.1);
      border: 1px solid rgba(233, 30, 140, 0.3);
      border-radius: 12px;
      text-align: center;
    }
    .approved h3 {
      color: #E91E8C;
      margin: 0 0 0.5rem 0;
    }
    .approved p {
      margin: 0;
      color: #aaa;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1>Magneetar Logo</h1>
  <p>Simple capital M — Moniepoint style</p>

  <div class="logos">
    <div class="logo-item">
      <img src="/m-logo.svg" width="200" height="200" alt="Logo 200px">
      <span>200 × 200</span>
    </div>
    <div class="logo-item">
      <img src="/m-logo.svg" width="120" height="120" alt="Logo 120px">
      <span>120 × 120</span>
    </div>
    <div class="logo-item">
      <img src="/m-logo.svg" width="64" height="64" alt="Logo 64px">
      <span>64 × 64</span>
    </div>
    <div class="logo-item">
      <img src="/m-logo.svg" width="32" height="32" alt="Logo 32px">
      <span>32 × 32</span>
    </div>
  </div>

  <div class="approved">
    <h3>Design: Simple Capital M</h3>
    <p>Stroke-based M with rounded caps — clean, minimal, Moniepoint-style</p>
  </div>
</body>
</html>
