# Prometheus configuration for Magneetar load testing
# Collects metrics from k6 via Prometheus remote write

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scrape Prometheus itself
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Grafana (optional)
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

# Remote write from k6
# k6 sends metrics here via --out prometheus
remote_write:
  - url: 'http://prometheus:9090/api/v1/write'
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s
      max_shards: 200
