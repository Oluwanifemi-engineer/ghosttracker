name: Backend Tests (PostgreSQL)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]

jobs:
  test-backend-postgres:
    name: Backend Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: magneetar
          POSTGRES_PASSWORD: magneetar
          POSTGRES_DB: magneetar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests against Postgres
        env:
          MT_DATABASE_URL: postgresql://magneetar:magneetar@127.0.0.1:5432/magneetar_test
        run: |
          cd server
          python -m pytest tests/ -v --tb=short
