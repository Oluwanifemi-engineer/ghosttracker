name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Deploy Dashboard to Vercel ──────────────────────────────────────────
  deploy-dashboard:
    name: Deploy Dashboard (Vercel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test -- --silent

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: dashboard

  # ─── Deploy Backend to Railway ───────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@main
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: magneetar-server

  # ─── Smoke Test ──────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    needs: [deploy-dashboard, deploy-backend]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check backend health
        run: |
          curl -sf https://magneetar-server.up.railway.app/health || \
            echo "⚠️ Backend health check failed (may still be deploying)"

      - name: Check dashboard
        run: |
          curl -sf https://magneetar.vercel.app > /dev/null || \
            echo "⚠️ Dashboard check failed (may still be deploying)"
