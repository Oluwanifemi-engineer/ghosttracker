name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Deploy via Docker Compose + Cloudflare Tunnel ───────────────────────
  deploy:
    name: Deploy (Docker Compose)
    runs-on: ubuntu-latest
    if: secrets.PRODUCTION_HOST != ''
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /home/oluwanifemi/Projects/magneetar
            git pull origin main
            bash scripts/deploy.sh

  # ─── Smoke Test ──────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check backend health
        run: |
          curl -sf https://api.magneetar.me/health || \
            echo "⚠️ Backend health check failed (may still be deploying)"

      - name: Check dashboard
        run: |
          curl -sf https://app.magneetar.me > /dev/null || \
            echo "⚠️ Dashboard check failed (may still be deploying)"

      - name: Verify dual-host consistency
        run: |
          HASH1=$(curl -sf https://magneetar.me | grep -o 'chunk-[a-f0-9]*' | head -1)
          HASH2=$(curl -sf https://app.magneetar.me | grep -o 'chunk-[a-f0-9]*' | head -1)
          if [ "$HASH1" = "$HASH2" ]; then
            echo "✅ Both hosts serve identical build ($HASH1)"
          else
            echo "⚠️ Host mismatch: magneetar.me=$HASH1 app.magneetar.me=$HASH2"
          fi
