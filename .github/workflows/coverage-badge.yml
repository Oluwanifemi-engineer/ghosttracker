# ═══════════════════════════════════════════════════════════════════════════════
# MAGNEETAR — Coverage Badge Generator
# Runs backend tests with coverage, generates an SVG badge, commits to main.
# ═══════════════════════════════════════════════════════════════════════════════

name: Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  badge:
    name: Generate Coverage Badge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          cd server
          python -m pytest tests/ -q --cov=. --cov-report=xml:coverage.xml --tb=no -q

      - name: Generate badge SVG
        run: |
          COVERAGE=$(python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('server/coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib['line-rate'])
          print(f'{rate:.0%}')
          ")

          # Map percentage to color
          PCT=$(echo "$COVERAGE" | sed 's/%//')
          if [ "$PCT" -ge 90 ]; then
            COLOR="#4c1"
          elif [ "$PCT" -ge 75 ]; then
            COLOR="#97ca00"
          elif [ "$PCT" -ge 50 ]; then
            COLOR="#dfb317"
          else
            COLOR="#e05d44"
          fi

          # Generate SVG badge
          cat > docs/coverage-badge.svg <<SVGEOF
          <svg xmlns="http://www.w3.org/2000/svg" width="106" height="20">
            <linearGradient id="b" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <mask id="a">
              <rect width="106" height="20" rx="3" fill="#fff"/>
            </mask>
            <g mask="url(#a)">
              <path fill="#555" d="M0 0h63v20H0z"/>
              <path fill="${COLOR}" d="M63 0h43v20H63z"/>
              <path fill="url(#b)" d="M0 0h106v20H0z"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="DejaVu Sans,Verdana,Geneva,sans-serif" font-size="11">
              <text x="32" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="32" y="14">coverage</text>
              <text x="84" y="15" fill="#010101" fill-opacity=".3">${COVERAGE}</text>
              <text x="84" y="14">${COVERAGE}</text>
            </g>
          </svg>
          SVGEOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' docs/coverage-badge.svg

          echo "Coverage: ${COVERAGE} (badge generated at docs/coverage-badge.svg)"

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage-badge.svg
          git diff --cached --quiet || git commit -m "chore(ci): update coverage badge [skip ci]"
          git push
