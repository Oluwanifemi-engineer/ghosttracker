name: Security Scans

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # weekly on Monday 06:00 UTC

jobs:
  trivy-filesystem-scan:
    name: Trivy filesystem scan (FS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for vulnerabilities (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          vuln-type: 'os,library'

  trivy-dockerfile-scan:
    name: Trivy Dockerfile scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan server Dockerfile
        if: hashFiles('server/Dockerfile') != ''
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'server/Dockerfile'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan dashboard Dockerfile
        if: hashFiles('dashboard/Dockerfile') != ''
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'dashboard/Dockerfile'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
