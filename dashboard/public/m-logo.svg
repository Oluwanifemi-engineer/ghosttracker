<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Premium Aqua Gradient Background -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Subtle inner glow -->
    <radialGradient id="inner-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Premium squircle background with aqua gradient -->
  <rect x="0" y="0" width="120" height="120" rx="28" ry="28" fill="url(#bg-gradient)"/>

  <!-- Inner glow overlay -->
  <rect x="0" y="0" width="120" height="120" rx="28" ry="28" fill="url(#inner-glow)"/>

  <!-- Ultra-bold capital M — straight edges, no curves -->
  <path
    d="M 28 92 L 28 28 L 48 28 L 60 58 L 72 28 L 92 28 L 92 92 L 76 92 L 76 52 L 60 82 L 44 52 L 44 92 Z"
    fill="white"
    stroke="none"
  />
</svg>
