<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="mg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="50%" stop-color="#E91E8C"/>
      <stop offset="100%" stop-color="#9C0A58"/>
    </linearGradient>
